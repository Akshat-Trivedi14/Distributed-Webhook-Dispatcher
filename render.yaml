# Render Blueprint: New + > Blueprint > pick this repo. Creates the web service and a Postgres database.
services:
  - type: web
    name: webhook-dispatcher
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-dispatcher-db
          property: connectionString

databases:
  - name: webhook-dispatcher-db
    plan: free
